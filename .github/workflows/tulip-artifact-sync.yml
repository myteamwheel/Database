name: Sync TULIP review artifacts

on:
  push:
    branches: [tulip-rotation-hardening]
    paths:
      - 'scripts/lib/tulip-beta.mjs'
      - 'scripts/build-v3.mjs'
      - 'app.js'
      - 'tests/tulip-beta.test.mjs'
      - 'tests/tulip-rotation-hardening.test.mjs'
      - '.github/workflows/tulip-artifact-sync.yml'

permissions:
  contents: write

concurrency:
  group: tulip-artifact-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pin deterministic build timestamp to the commit
        shell: bash
        run: echo "BUILD_GENERATED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Rebuild complete browser payload
        run: |
          npm run build
          node tests/tulip-rotation-hardening.test.mjs
          npm run test:tulipbeta
          npm run verify:artifact
      - name: Commit generated review artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add public/data.json public/standalone.html
          if git diff --cached --quiet; then
            echo 'TULIP review artifacts already current.'
            exit 0
          fi
          git commit -m "Rebuild TULIP review artifacts for ${GITHUB_SHA::7}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin tulip-rotation-hardening
          git rebase origin/tulip-rotation-hardening
          git push origin HEAD:tulip-rotation-hardening
