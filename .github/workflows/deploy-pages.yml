# Publish the static database app to GitHub Pages.
#
# The app is fully static: index.html fetches ./public/data.json at runtime, and
# public/standalone.html is a self-contained single-file fallback. Nothing is built here — the
# generated artifacts are committed, and rebuild-generated.yml is what regenerates them. This
# workflow only publishes what is already in the tree, so a deploy can never silently ship data
# that differs from what was audited.
name: Deploy to GitHub Pages

# The github-pages environment restricts deployments to the repository's DEFAULT branch by
# default. This repo's default is v3-official-data, so a run triggered only on main failed
# before executing a single step. Both branches are kept in sync, so deploy from either.
on:
  push:
    branches: [main, v3-official-data]
    paths:
      - 'index.html'
      - 'history-lab.html'
      - 'app.js'
      - 'workspace.js'
      - 'styles.css'
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do not cancel a running one: a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the payload the site actually loads
        run: |
          set -euo pipefail
          test -f public/data.json || { echo "public/data.json missing — run npm run build"; exit 1; }
          test -f index.html || { echo "index.html missing"; exit 1; }
          # Assert against the REAL shape (d.leagues.NBA / d.leagues.GLEAGUE). An earlier version
          # guessed d.nba / d.players.nba, found nothing, and failed every deploy — the guard was
          # rejecting a perfectly good payload because the guard itself was wrong.
          node -e "
            const d = require('./public/data.json');
            const nba = d.leagues?.NBA?.length ?? 0;
            const g = d.leagues?.GLEAGUE?.length ?? 0;
            if (!nba || !g) {
              console.error('data.json is missing player rows: NBA=' + nba + ' GLEAGUE=' + g);
              console.error('leagues keys: ' + Object.keys(d.leagues || {}).join(', '));
              process.exit(1);
            }
            console.log('data.json OK: ' + nba + ' NBA rows, ' + g + ' G League rows');
          "

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/public
          # Copy ALL root-level web assets by glob rather than an enumerated list. The enumerated
          # version silently shipped a broken site when history-lab.js was added later: the page
          # deployed fine and 404'd on its own script. A glob cannot go stale that way.
          cp *.html *.js *.css _site/
          cp -R public/. _site/public/
          # .nojekyll stops GitHub stripping paths that begin with an underscore.
          touch _site/.nojekyll
          # Every <script src> and <link href> the pages reference must exist in _site, or the
          # deploy is broken in a way a 200 on the root URL will not reveal.
          missing=0
          for page in _site/*.html; do
            for ref in $(grep -oE '(src|href)="[^":]+\.(js|css)"' "$page" | sed -E 's/.*="([^"]+)"/\1/'); do
              if [ ! -f "_site/$ref" ]; then echo "MISSING asset $ref referenced by $(basename "$page")"; missing=1; fi
            done
          done
          [ "$missing" = "0" ] || { echo "refusing to deploy a site with missing assets"; exit 1; }
          echo "all referenced assets present"
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
