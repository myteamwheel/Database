name: Sync projection review artifacts

on:
  push:
    branches: [projection-model-rebuild-next]
    paths:
      - 'scripts/build-projections.mjs'
      - 'scripts/fit-projections.mjs'
      - 'scripts/lib/projection-context.mjs'
      - 'scripts/lib/projection-validation.mjs'
      - 'scripts/lib/forecast-timeframes.mjs'
      - 'PROJECTION_2026_27.json'
      - '.github/workflows/projection-artifact-sync.yml'

permissions:
  contents: write

concurrency:
  group: projection-artifact-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Rebuild projection payload and standalone artifact
        run: |
          npm run fit:projections
          npm run build:projections
          npm run publish:status
          npm run verify:publication
          npm run build:standalone
          node tests/forecast-timeframes.test.mjs
          node tests/projection-validation.test.mjs
          npm run test:projections
          npm run verify:artifact
      - name: Commit generated review artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECTION_2026_27.json public/data.json public/data-status.json public/standalone.html
          if git diff --cached --quiet; then
            echo 'Projection review artifacts already current.'
            exit 0
          fi
          git commit -m "Rebuild projection review artifacts for ${GITHUB_SHA::7}"
          git fetch origin projection-model-rebuild-next
          git rebase origin/projection-model-rebuild-next
          git push origin HEAD:projection-model-rebuild-next
