name: One-shot forecast archive capture

on:
  pull_request:
    paths:
      - '.github/workflows/archive-forecast-once.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'forecast-archive-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Capture deployed preseason forecast
        run: |
          npm run archive:forecast -- \
            --ref e7182849d62cba46566f3ffafc4c1e620e5ef8ff \
            --id 2026-27-preseason-2026-09-29-e718284 \
            --published-at 2026-09-29
      - name: Commit archive only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/data/forecast-archive
          git diff --cached --exit-code >/dev/null && { echo 'archive not generated'; exit 1; } || true
          git commit -m 'data: freeze 2026-27 preseason forecast'
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}
