name: Forecast archive development tests

on:
  pull_request:
    branches: [v3-official-data]
    paths:
      - 'scripts/lib/forecast-archive.mjs'
      - 'scripts/archive-forecast.mjs'
      - 'scripts/score-forecast-archive.mjs'
      - 'scripts/verify-forecast-archive.mjs'
      - 'scripts/data/forecast-archive/**'
      - 'tests/forecast-archive.test.mjs'
      - 'package.json'
      - '.github/workflows/forecast-archive-dev.yml'
      - '.github/workflows/audit-player-database.yml'

permissions:
  contents: write

jobs:
  forecast-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run forecast archive tests
        run: node tests/forecast-archive.test.mjs

      - name: Generate canonical e718284 snapshot when absent
        id: snapshot
        shell: bash
        run: |
          SNAPSHOT="scripts/data/forecast-archive/2026-27-preseason-2026-09-29-e718284.json"
          if [[ -f "$SNAPSHOT" ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run archive:forecast -- \
            --ref e7182849d62cba46566f3ffafc4c1e620e5ef8ff \
            --id 2026-27-preseason-2026-09-29-e718284 \
            --published-at 2026-09-29
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Re-run archive tests against generated snapshot
        if: steps.snapshot.outputs.created == 'true'
        run: node tests/forecast-archive.test.mjs

      - name: Commit generated snapshot to feature branch
        if: steps.snapshot.outputs.created == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/forecast-archive/index.json \
            scripts/data/forecast-archive/2026-27-preseason-2026-09-29-e718284.json
          git commit -m "data: freeze 2026-27 preseason forecast"
          git push origin HEAD:${{ github.head_ref }}
