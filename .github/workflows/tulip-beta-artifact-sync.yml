name: Sync TULIP review artifacts

on:
  push:
    branches: [tulip-minutes-validation-next]
    paths:
      - 'scripts/build-v3.mjs'
      - 'scripts/lib/tulip-beta.mjs'
      - 'scripts/lib/tulip-beta-diagnostics.mjs'
      - 'app.js'
      - '.github/workflows/tulip-beta-artifact-sync.yml'

permissions:
  contents: write

concurrency:
  group: tulip-beta-artifact-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Rebuild TULIP data and standalone artifact
        run: |
          npm run build:data
          npm run build:standalone
          npm run test:tulipbeta
          npm run test:tulipbeta:diagnostics
          npm run verify:artifact
      - name: Commit generated review artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json public/standalone.html
          if git diff --cached --quiet; then
            echo 'TULIP review artifacts already current.'
            exit 0
          fi
          git commit -m "Rebuild TULIP review artifacts for ${GITHUB_SHA::7}"
          git fetch origin tulip-minutes-validation-next
          git rebase origin/tulip-minutes-validation-next
          git push origin HEAD:tulip-minutes-validation-next
