name: Audit 2025-26 player database and UI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The data build itself cannot run here: stats.nba.com does not answer from
      # GitHub-hosted runners. public/data.json is built locally and committed, and
      # this workflow validates the committed artefact.
      - name: Audit committed player data
        run: node scripts/audit-v3.mjs

      - name: JavaScript syntax check
        run: |
          node --check app.js
          for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done

      - name: Verify data contract the UI depends on
        run: |
          node - <<'NODE'
          const d = require('./public/data.json');
          const problems = [];
          if (!d.leagues?.NBA?.length || !d.leagues?.GLEAGUE?.length) problems.push('missing league arrays');
          if (d.counts.NBA !== d.leagues.NBA.length) problems.push('NBA count mismatch');
          if (d.counts.GLEAGUE !== d.leagues.GLEAGUE.length) problems.push('G League count mismatch');
          if (d.gradeModel?.version !== '3.0') problems.push('grade model version is not 3.0');
          for (const lg of ['NBA', 'GLEAGUE']) {
            const p = d.leagues[lg][0];
            for (const k of ['playerId', 'name', 'team', 'position', 'grade', 'custom', 'components', 'stats'])
              if (p[k] === undefined) problems.push(`${lg} records missing ${k}`);
            if (d.leagues[lg].some(x => !(x.grade >= 0 && x.grade <= 9.9999)))
              problems.push(`${lg} has a grade outside 0.0000-9.9999`);
            const ranks = d.leagues[lg].map(x => x.rank).sort((a, b) => a - b);
            if (ranks[0] !== 1 || ranks[ranks.length - 1] !== d.leagues[lg].length)
              problems.push(`${lg} ranks are not a dense 1..n sequence`);
          }
          // The G League publishes no BPM/VORP family; it must never be invented.
          if (d.leagues.GLEAGUE.some(p => p.bpm != null || p.vorp != null))
            problems.push('G League rows carry fabricated BPM/VORP');
          if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
          console.log(`contract ok · NBA ${d.counts.NBA} · G League ${d.counts.GLEAGUE} · crossovers ${d.counts.both}`);
          NODE
