name: One-shot forecast archive schema regeneration

on:
  pull_request:
    paths:
      - '.github/workflows/archive-forecast-regenerate-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'forecast-archive-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Recreate initial snapshot from frozen release
        shell: bash
        run: |
          rm -f scripts/data/forecast-archive/2026-27-preseason-2026-09-29-e718284.json
          rm -f scripts/data/forecast-archive/index.json
          npm run archive:forecast -- \
            --ref e7182849d62cba46566f3ffafc4c1e620e5ef8ff \
            --id 2026-27-preseason-2026-09-29-e718284 \
            --published-at 2026-09-29
          npm run test:forecast-archive
          npm run verify:forecast-archive
      - name: Commit regenerated archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/data/forecast-archive
          git diff --cached --exit-code >/dev/null && { echo 'archive bytes did not change'; exit 1; } || true
          git commit -m 'data: embed forecast archive coverage metadata'
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}
