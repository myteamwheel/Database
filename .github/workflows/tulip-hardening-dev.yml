name: TULIP rotation hardening tests

on:
  pull_request:
    branches: [projection-model-rebuild-next]
    paths:
      - 'scripts/lib/tulip-beta.mjs'
      - 'scripts/build-v3.mjs'
      - 'app.js'
      - 'tests/tulip-beta.test.mjs'
      - 'tests/tulip-rotation-hardening.test.mjs'
      - 'docs/superpowers/plans/2026-09-29-tulip-rotation-hardening.md'
      - 'docs/MODEL_REBUILD_CHECKLIST.md'
      - '.github/workflows/tulip-hardening-dev.yml'
  workflow_dispatch:

jobs:
  tulip-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run focused TULIP hardening tests
        run: |
          node tests/tulip-rotation-hardening.test.mjs
          npm run test:tulipbeta
