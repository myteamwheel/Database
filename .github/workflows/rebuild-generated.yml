name: Rebuild committed browser artifacts

on:
  push:
    branches: [main, v3-official-data]
    paths:
      - 'scripts/**'
      - '!scripts/data/history/player_history_product.json'
      - 'app.js'
      - 'workspace.js'
      - 'history-lab.js'
      - 'history-lab.html'
      - 'index.html'
      - 'styles.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rebuild-generated.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rebuild-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    # Generated commits change only tracked products; they do not re-trigger this workflow because
    # those output paths are not in the trigger set. Source commits created by controlled migration
    # workflows are therefore rebuilt exactly once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Pin deterministic build timestamp to the commit
        shell: bash
        run: echo "BUILD_GENERATED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Hydrate immutable historical cache and build historical products
        shell: bash
        run: |
          git archive c17bc8d7cf2e41822a8bcf6fbf4b0b62bca095ee \
            scripts/data/history/provenance.json \
            scripts/data/history/2015-16 scripts/data/history/2016-17 \
            scripts/data/history/2017-18 scripts/data/history/2018-19 \
            scripts/data/history/2019-20 scripts/data/history/2020-21 \
            scripts/data/history/2021-22 scripts/data/history/2022-23 \
            scripts/data/history/2023-24 scripts/data/history/2024-25 | tar -x
          npm run build:history
          node scripts/audit-history.mjs --strict
          node scripts/verify-history-hashes.mjs --strict

      - name: Rebuild database, models, projections, comps, and browser artifact
        run: |
          npm run build
          node scripts/audit-v3.mjs
          node scripts/audit-presets.mjs
          node scripts/tulip-verify.mjs
          npm run test:tulipbeta
          npm run test:tulipcapacity
          npm run test:projections
          npm run test:comps
          npm run test:history
          npm run test:starter
          node scripts/verify-artifact.mjs

      - name: Commit generated browser and historical feature artifacts if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/data/history/player_history_product.json \
            public/history-games.json.gz public/history-role-features.json.gz \
            public/data.json public/standalone.html
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git commit -m "Rebuild browser artifacts for ${GITHUB_SHA::7}"
          # Another maintenance workflow (for example starter acceptance evidence) can legitimately
          # advance the deployment branch while this longer rebuild is running. Rebase our generated
          # artifact commit onto that new tip instead of failing a non-fast-forward push or forcing
          # away someone else's evidence commit.
          # Only the staged/committed artifact set is meant to persist. The history hydration/build
          # can leave other tracked cache files modified locally; discard those ephemeral worktree
          # changes before rebasing the artifact commit.
          git reset --hard HEAD
          git clean -fd
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

          # Pushes made with GITHUB_TOKEN deliberately do not trigger ordinary push workflows.
          # Dispatch Pages explicitly so the site publishes this exact audited artifact commit.
          GH_TOKEN='${{ github.token }}' gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
