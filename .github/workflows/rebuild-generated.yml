name: Rebuild committed browser artifacts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '!scripts/data/history/player_history_product.json'
      - 'app.js'
      - 'workspace.js'
      - 'index.html'
      - 'styles.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rebuild-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-generated-main
  cancel-in-progress: true

jobs:
  rebuild:
    # The generated commit changes public/ plus the explicitly excluded history-product file, so it
    # cannot recursively trigger this workflow. This deliberately allows a source commit created by
    # github-actions[bot] (for example a controlled migration workflow) to rebuild artifacts once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pin deterministic build timestamp to the commit
        shell: bash
        run: echo "BUILD_GENERATED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Hydrate immutable historical cache for history-product build
        shell: bash
        run: |
          git archive c17bc8d7cf2e41822a8bcf6fbf4b0b62bca095ee \
            scripts/data/history/2015-16 scripts/data/history/2016-17 \
            scripts/data/history/2017-18 scripts/data/history/2018-19 \
            scripts/data/history/2019-20 scripts/data/history/2020-21 \
            scripts/data/history/2021-22 scripts/data/history/2022-23 \
            scripts/data/history/2023-24 scripts/data/history/2024-25 | tar -x
          node scripts/build-history-summary.mjs
          node scripts/build-history-games.mjs
          node scripts/audit-history.mjs
          node scripts/verify-history-hashes.mjs

      - name: Build from committed source snapshots
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          node scripts/build-v3.mjs
          node scripts/build-artifact.mjs
          node scripts/audit-v3.mjs
          node scripts/audit-presets.mjs
          node scripts/tulip-verify.mjs
          npm run test:history
          npm run test:starter
          node scripts/verify-artifact.mjs

      - name: Commit generated browser artifacts if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/data/history/player_history_product.json public/history-games.json.gz public/data.json public/standalone.html
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git commit -m "Rebuild browser artifacts for ${GITHUB_SHA::7}"
          git push origin HEAD:main
